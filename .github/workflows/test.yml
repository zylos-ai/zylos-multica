name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests with a canonical temporary directory
        shell: bash
        run: |
          export TMPDIR="$(node -e 'console.log(require("fs").realpathSync(require("os").tmpdir()))')"
          npm test
